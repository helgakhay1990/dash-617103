<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Красная Поляна 2027</title>
<style>
:root{
  color-scheme: light;
  --surface-1:#ffffff; --plane:#f4f6f9;
  --text-primary:#0f1319; --text-secondary:#4a5260; --muted:#818a99;
  --grid:#e3e8ef; --axis:#c8d0da; --border:rgba(15,19,25,0.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#006300; --bad:#d03b3b; --warn:#fab219;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --surface-1:#191d24; --plane:#0f1216;
  --text-primary:#f2f5f9; --text-secondary:#b3bcc9; --muted:#7e8794;
  --grid:#272d36; --axis:#39414c; --border:rgba(255,255,255,0.11);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good:#0ca30c; --bad:#e66767;
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#191d24; --plane:#0f1216;
  --text-primary:#f2f5f9; --text-secondary:#b3bcc9; --muted:#7e8794;
  --grid:#272d36; --axis:#39414c; --border:rgba(255,255,255,0.11);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good:#0ca30c; --bad:#e66767;
}
*{box-sizing:border-box}
body{margin:0;padding:28px 20px 60px;background:var(--plane);color:var(--text-primary);
     font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;
     -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{margin-bottom:2px}
h1{font-size:27px;margin:0 0 5px;letter-spacing:-0.025em;font-weight:650;text-wrap:balance}
.sub{color:var(--text-secondary);font-size:13.5px}
.sub b{color:var(--text-primary);font-weight:600}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
h2{font-size:15px;margin:0 0 14px;font-weight:620;letter-spacing:-0.01em}
h2 .hint{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:15px 17px;
      border-top:2px solid var(--s1)}
.tile .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tile .val{font-size:29px;font-weight:640;margin:6px 0 3px;letter-spacing:-0.03em;font-variant-numeric:tabular-nums}
.tile .note{font-size:12.5px;color:var(--text-secondary)}
.status{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-secondary)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;align-items:center}
button.f{font:inherit;font-size:13px;padding:6px 13px;border-radius:99px;cursor:pointer;
  border:1px solid var(--border);background:transparent;color:var(--text-secondary)}
button.f[aria-pressed="true"]{background:var(--text-primary);color:var(--surface-1);border-color:var(--text-primary)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;
   letter-spacing:.04em;padding:0 10px 8px;border-bottom:1px solid var(--grid);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
tr:last-child td{border-bottom:none}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hotel{font-weight:600}
.room{color:var(--text-secondary);font-size:12.5px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:99px;
     border:1px solid var(--border);color:var(--text-secondary);white-space:nowrap;font-weight:500}
.tag.target{border-color:var(--s3);color:var(--s3)}
.tag .alt{opacity:.65;font-variant-numeric:tabular-nums}
.up{color:var(--bad)} .down{color:var(--good)} .flat{color:var(--muted)}
.min{color:var(--good);font-size:11.5px;white-space:nowrap}
.scroll{overflow-x:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--text-secondary);margin-top:10px}
.legend i{display:inline-block;width:11px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.empty{color:var(--muted);font-size:13.5px;padding:28px 0;text-align:center}
.mv{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--grid);align-items:flex-start}
.mv:last-child{border-bottom:0}
.mv-sign{flex:none;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:13px}
.mv-sign.out{background:rgba(208,59,59,.14);color:var(--bad)}
.mv-sign.in{background:rgba(0,99,0,.14);color:var(--good)}
.mv-txt{font-size:13.5px;color:var(--text-secondary)}
.mv-txt b{color:var(--text-primary);font-weight:600}
.mv-txt small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.mv.mine .mv-txt b{color:var(--s1)}
.mv-head{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:2px 0 6px}
.mv-head.ok{color:var(--good)}
.mv-more{margin-top:10px}
.mv-more summary{cursor:pointer;font-size:13px;color:var(--muted);padding:6px 0}
.note-line{font-size:12.5px;color:var(--text-secondary);margin-top:12px}
svg{display:block;width:100%;height:auto;overflow:visible}
button.f:focus-visible,a:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
@media (max-width:640px){ body{padding:20px 14px 48px} h1{font-size:23px} .card{padding:15px 14px} }
</style>
<div class="wrap">
<div class="head">

<div class="card">

  <div class="filters" id="filters2"></div>
  <div class="scroll"><table id="tbl">
    <thead><tr id="thead"></tr></thead><tbody></tbody>
  </table></div>
  <div class="note-line" id="tblnote"></div>
</div>

<div class="card">
  <div class="status" id="status"></div>
</div>
</div>

  const box = document.getElementById('moves');
  const mine = E.filter(e=>e.mine), other = E.filter(e=>!e.mine);
  const line = e => {
    const gone = e.event === 'ушёл';
    return `<div class="mv ${e.mine?'mine':''}">
      <span class="mv-sign ${gone?'out':'in'}">${gone?'−':'+'}</span>
      <span class="mv-txt"><b>${e.hotel}</b> · ${e.room}
        <small>${e.ts} · вылет ${e.target.slice(0,5)} · ${D.zone_label[e.zone]||e.zone} · ${fmt(+e.price)} ₽</small></span>
    </div>`;
  };
  let html = '';
  if(mine.length){
    html += `<div class="mv-head">В ваших зонах</div>` + mine.map(line).join('');
  } else {
    html += `<div class="mv-head ok">В ваших зонах пока ничего не пропадало</div>`;
  }
  if(other.length){
    html += `<details class="mv-more"><summary>Остальные зоны (${other.length})</summary>${other.map(line).join('')}</details>`;
  }
  box.innerHTML = html;
})();

/* ——— плитки: лучшая цена по каждой дате вылета в целевых зонах ——— */
const targets = [...new Set(D.rows.map(r=>r.target))].sort();
const tiles = document.getElementById('tiles');
targets.forEach(t=>{
  const pool = D.rows.filter(r=>r.target===t && (r.zone==='rosa_niz'||r.zone==='rosa_verh') && r.meal!=='без питания');
  if(!pool.length) return;
  const best = pool.reduce((a,b)=>a.price<b.price?a:b);
  const d = best.prev===null? null : best.price-best.prev;
  const dTxt = d===null? 'первое наблюдение' : d===0? 'без изменений' : (d>0?'+':'')+fmt(d)+' ₽ с прошлой проверки';
  tiles.insertAdjacentHTML('beforeend',
    `<div class="tile"><div class="lbl">вылет ${t}</div>
     <div class="val">${fmt(best.price)} ₽</div>
     <div class="note">${best.short} · ${best.stars}<br><span class="${d>0?'up':d<0?'down':'flat'}">${dTxt}</span></div></div>`);
});

/* ——— график ——— */
(function(){
  const box = document.getElementById('chart');
  const keys = Object.keys(D.series).sort();
  const pts = keys.flatMap(k=>D.series[k]);
  const stamps = [...new Set(pts.map(p=>p[0]))].sort();
  if(stamps.length < 2){
    box.innerHTML = `<div class="empty">История только набирается — на графике нужны минимум две проверки.<br>
      Сейчас записана ${stamps.length===1?'одна':'ни одной'}. Загляните через пару часов.</div>`;
    return;
  }
  const W=1080,H=300,L=68,R=18,T=16,B=42;
  const xs = stamps, x = i => L + i*(W-L-R)/(xs.length-1);
  const vals = pts.map(p=>p[1]);
  let vlo=Math.min(...vals), vhi=Math.max(...vals);
  // «круглый» шаг сетки — иначе на узком диапазоне подписи округляются в одно и то же число
  const raw=(vhi-vlo||vhi*0.02)/4;
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw)||mag*10;
  let lo=Math.floor(vlo/step)*step - step*0.5, hi=Math.ceil(vhi/step)*step + step*0.5;
  const y = v => T + (hi-v)*(H-T-B)/(hi-lo);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Динамика лучшей цены">`;
  for(let v=Math.ceil(lo/step)*step; v<=hi; v+=step){
    const yy=y(v);
    s += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>`;
    s += `<text x="${L-10}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)"
           style="font-variant-numeric:tabular-nums">${fmt(Math.round(v))}</text>`;
  }
  const tickEvery = Math.ceil(xs.length/6);
  xs.forEach((ts,i)=>{ if(i%tickEvery && i!==xs.length-1) return;
    s += `<text x="${x(i)}" y="${H-B+20}" text-anchor="middle" font-size="11" fill="var(--muted)">${ts.slice(11)}</text>`;
    if(i===0||i===xs.length-1) s += `<text x="${x(i)}" y="${H-B+34}" text-anchor="middle" font-size="10" fill="var(--muted)">${ts.slice(8,10)}.${ts.slice(5,7)}</text>`;
  });
  s += `<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--axis)" stroke-width="1"/>`;
  const labels=[];
  keys.forEach((k,si)=>{
    const map = Object.fromEntries(D.series[k]);
    let cur=null; const pathPts=[];
    xs.forEach((ts,i)=>{ if(map[ts]!==undefined) cur=map[ts]; if(cur!==null) pathPts.push([x(i),y(cur)]); });
    if(!pathPts.length) return;
    const col=`var(${SC[si%3]})`;
    s += `<path d="${pathPts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}"
           fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last=pathPts[pathPts.length-1];
    s += `<circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="${col}" stroke="var(--surface-1)" stroke-width="2"/>`;
    labels.push({x:last[0], y:last[1], k, v:map[xs[xs.length-1]] ?? cur});
  });
  // разводим подписи по вертикали, если линии сошлись вплотную
  labels.sort((a,b)=>a.y-b.y);
  for(let i=1;i<labels.length;i++)
    if(labels[i].y - labels[i-1].y < 15) labels[i].y = labels[i-1].y + 15;
  labels.forEach(l=>{
    s += `<text x="${l.x-9}" y="${l.y+4}" text-anchor="end" font-size="11.5" font-weight="600"
           fill="var(--text-primary)" style="font-variant-numeric:tabular-nums">${l.k} · ${fmt(l.v)}</text>`;
  });
  s += `</svg>`;
  box.innerHTML = s + `<div class="legend">` +
    keys.map((k,i)=>`<span><i style="background:var(${SC[i%3]})"></i>вылет ${k}</span>`).join('') + `</div>`;
})();

/* ——— таблица с фильтром ——— */
const zones = [['my','Только мои зоны'],['rosa_niz',D.zone_label.rosa_niz],['rosa_verh',D.zone_label.rosa_verh],
               ['esto',D.zone_label.esto],['kp',D.zone_label.kp],['all','Все']];
let active='my', mealOnly=false;
const fbox=document.getElementById('filters');
zones.forEach(([k,l])=>{
  const b=document.createElement('button'); b.className='f'; b.textContent=l;
  b.setAttribute('aria-pressed', k===active); b.onclick=()=>{active=k;
    [...fbox.children].forEach(c=>c.setAttribute('aria-pressed',false));
    b.setAttribute('aria-pressed',true); draw();};
  fbox.appendChild(b);
});
const f2=document.getElementById('filters2');
const mb=document.createElement('button'); mb.className='f'; mb.textContent='Только с питанием';
mb.setAttribute('aria-pressed',false);
mb.onclick=()=>{mealOnly=!mealOnly; mb.setAttribute('aria-pressed',mealOnly); draw();};
f2.appendChild(mb);

document.getElementById('thead').innerHTML =
  `<th>Отель</th><th>Зона</th><th>Фонд</th><th>Питание</th>` +
  targets.map(t=>`<th class="num">${t}</th>`).join('');

function draw(){
  const tb=document.querySelector('#tbl tbody');
  let pool=D.rows.filter(r=> active==='all' ? true
        : active==='my' ? (r.zone==='rosa_niz'||r.zone==='rosa_verh') : r.zone===active);
  if(mealOnly) pool=pool.filter(r=>r.meal!=='без питания');

  // одна строка на отель: берём самый дешёвый вариант, цены раскладываем по датам вылета
  const byHotel={};
  pool.forEach(r=>{
    const h=(byHotel[r.hotel] ||= {best:r, cells:{}});
    if(r.price < h.best.price) h.best=r;
    const c=h.cells[r.target];
    if(!c || r.price<c.price) h.cells[r.target]=r;
  });
  const list=Object.values(byHotel).sort((a,b)=>a.best.price-b.best.price);

  tb.innerHTML = list.map(({best,cells})=>{
    const fond = best.renov? 'ремонт '+best.renov : (best.year? 'постр. '+best.year : '—');
    const tgt = (best.zone==='rosa_niz'||best.zone==='rosa_verh');
    const cellsHtml = targets.map(t=>{
      const r=cells[t];
      if(!r) return `<td class="num flat">—</td>`;
      const d = r.prev===null? null : r.price-r.prev;
      const dTxt = (d===null||d===0)? ''
        : `<div class="${d>0?'up':'down'}" style="font-size:11.5px">${(d>0?'+':'')+fmt(d)}</div>`;
      const isMin = r.price===r.lo && r.lo!==r.hi;
      return `<td class="num"><span style="font-weight:600">${fmt(r.price)}</span>${dTxt}
        ${isMin?'<div class="min">минимум</div>':''}</td>`;
    }).join('');
    return `<tr>
      <td><div class="hotel">${best.short} <span style="color:var(--muted);font-weight:400">${best.stars}</span></div>
          <div class="room">${best.room.replace(/ (BB|AO) /,' · ')}</div>
          ${best.note?`<div class="room" style="color:var(--muted)">${best.note}</div>`:''}</td>
      <td><span class="tag ${tgt?'target':''}">${D.zone_label[best.zone]||best.zone}
            <span class="alt">${D.zone_alt[best.zone]||''}</span></span>
          <div class="room" style="margin-top:4px">${best.lift}</div></td>
      <td>${fond}</td>
      <td>${best.meal==='без питания'?'<span class="flat">нет</span>':best.meal}</td>
      ${cellsHtml}</tr>`;
  }).join('') || `<tr><td colspan="${4+targets.length}" class="empty">Вариантов нет</td></tr>`;

  document.getElementById('tblnote').textContent =
    `Отелей: ${list.length}. В строке — самый дешёвый номер отеля, в колонках — его цена по каждой дате вылета. `
    + `Мелким шрифтом под ценой — изменение с прошлой проверки.`;
}
draw();

/* ——— статус ——— */
(function(){
  const ok = D.last_status==='ок';
  document.getElementById('status').innerHTML =
    `<span class="dot" style="background:var(${ok?'--good':'--warn'})"></span>` +
    `Трекер ${ok?'работает':'последний раз ответил с ошибкой'} · проверок: ${D.checks}` +
    (D.fails?` · неудачных: ${D.fails}`:'') +
    ` · последняя ${D.last} · собрано ${D.built}`;
})();
</script>

</html>
